[bumpversion]
current_version = 1.0.1
commit = True
tag = True
tag_name = v{new_version}
message = chore: 发布版本 v{new_version}

[bumpversion:file:auto_play.py]
search = __version__ = "{current_version}"
replace = __version__ = "{new_version}"

[bumpversion:file:CHANGELOG.md]
search = ## [未发布]
replace =
